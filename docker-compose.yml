version: '3.8'

services:
  postgres:
    image: postgres:15-alpine # Alpine весит меньше и запускается быстрее
    container_name: football_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Чтобы данные не удалялись при перезапуске

